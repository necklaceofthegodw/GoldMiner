server <input id="server" value="http://localhost:4173" /><br />
<form
	id="launch"
	method="post"
	action="http://localhost:4173/api/launch"
	enctype="application/x-www-form-urlencoded"
>
	playerId <input name="playerId" value="player123" /><br />
	armEndpoint <input name="armEndpoint" value="http://localhost:8080/na" /><br />
	returnEndpoint <input name="returnEndpoint" value="http://localhost:8081/na"><br />
	startAt <input name="startAt" size="28"><br />
	endAt <input name="endAt" size="28"> <button type="button" id="resetTimes">now +1 / +3 min</button><br />
	<input type="submit" />
</form>
<script>
	const form = document.getElementById("launch");
	function resetTimes() {
		const now = Date.now();
		form.startAt.value = new Date(now + 60_000).toISOString();
		form.endAt.value = new Date(now + 180_000).toISOString();
	}
	document.getElementById("resetTimes").addEventListener("click", resetTimes);
	form.addEventListener("submit", () => {
		form.action = document.getElementById("server").value.trim().replace(/\/+$/, "") + "/api/launch";
	});
	resetTimes();
</script>
